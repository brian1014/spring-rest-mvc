spring.application.name=spring-7-rest-mvc
server.port=8081
logging.level.guru.springframework=debug

# ======= LOGGING WITH LOGBOOK =======
logging.level.org.zalando.logbook=trace
# ======= LOGGING WITH LOGBOOK =======

# ======= FLYWAY MIGRATIONS =======
spring.flyway.enabled=false
# ======= FLYWAY MIGRATIONS =======

# ======= SPRING BOOT DOCKER COMPOSE =======
spring.docker.compose.enabled=false
# ======= SPRING BOOT DOCKER COMPOSE =======

# ======= URL RESOURCE SERVER jwt =======
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
# ======= URL RESOURCE SERVER jwt =======

# ======= VIRTUAL THREADS =======
spring.threads.virtual.enabled=true
# ======= VIRTUAL THREADS =======

# ======= PROPERTIES FOR KUBERNETES =======
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
# ======= PROPERTIES FOR KUBERNETES =======

# ======= SPRING BOOT CACHE =======
spring.cache.cache-names=beerCache,beerListCache,customerCache,customerListCache
# ======= SPRING BOOT CACHE =======

# ======= HTTP BASIC CONFIG =======
#spring.security.user.name=user1
#spring.security.user.password=password
# ======= HTTP BASIC CONFIG =======

